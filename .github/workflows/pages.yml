name: Publish verified CarThing downloads
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject application source in public distribution
        run: node scripts/verify-distribution.mjs
      - name: Verify existing release packages
        run: node scripts/prepare-store-downloads.mjs
      - name: Preserve public release download links
        run: node scripts/mirror-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: store
      - uses: actions/deploy-pages@v4
